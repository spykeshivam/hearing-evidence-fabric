[project]
name = "hearing-evidence"
version = "0.1.0"
description = "Court hearing audio linked to case records in Microsoft Fabric"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4"]

[project.optional-dependencies]
audio = ["librosa", "numpy"]
nlp = ["rapidfuzz", "eyecite", "pydantic>=2", "jiwer"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearing_evidence"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Fabric-generated notebook sources; Spark globals (spark, display) are injected at runtime.
extend-exclude = ["fabric"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]