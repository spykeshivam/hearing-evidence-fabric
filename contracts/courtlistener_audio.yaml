source_id: courtlistener_audio
owner: shiv
description: Oral-argument audio plus docket and panel metadata (Free Law Project)
source_url: https://www.courtlistener.com/api/rest/v4/audio/
access: free API token; default limits 5/min, 50/hour, 125/day
licence:
  id: public-domain-court-records
  checked_on: 2026-10-19
  terms_url: https://www.courtlistener.com/terms/
  attribution: Credit Free Law Project / CourtListener
  notes: >
    No explicit data licence in the terms (modified 2026-08-05). Court
    recordings and docket metadata treated as public records. Rules observed:
    one account, no credential sharing, requests paced under 5/min,
    no use for FCRA-type decisions, AI-derived outputs labelled as ours,
    not CourtListener's.
classification: public record; no private or sealed audio
refresh: manual, per batch
required_provenance_fields: [source_url, retrieved_at, sha256, licence_id]
quality_expectations:
  min_rows_per_batch: 1
  min_sample_rate_hz: 16000
# schema: every listed field must be present. Fields silver reads keep a strict type
# (audio_meta.duration, audio_meta.local_path_mp3); every other field may be null.
# Unlisted fields pass through `additionalProperties: true`. Check docs/decisions.md,
# 2026-11-13 for more details.
schema:
  # docket: unwrap data["results"][0] first -- CourtListener's docket search endpoint
  # wraps the single match in a pagination envelope. Silver reads no docket fields.
  docket:
    type: object
    additionalProperties: true
    required:
      [id, resource_uri, absolute_url, court, court_id, case_name,
       docket_number, docket_number_core, docket_number_raw, docket_number_source,
       slug, date_argued, date_filed, date_created, date_modified, audio_files,
       clusters, panel, tags, source, blocked, appeal_from, appeal_from_str,
       original_court_info]
    properties:
      id: {type: [integer, "null"]}
      resource_uri: {type: [string, "null"]}
      absolute_url: {type: [string, "null"]}
      court: {type: [string, "null"]}
      court_id: {type: [string, "null"]}
      case_name: {type: [string, "null"]}
      case_name_short: {type: [string, "null"]}
      docket_number: {type: [string, "null"]}
      docket_number_core: {type: [string, "null"]}
      docket_number_raw: {type: [string, "null"]}
      docket_number_source: {type: [integer, "null"]}
      slug: {type: [string, "null"]}
      date_argued: {type: [string, "null"]}
      date_filed: {type: [string, "null"]}
      date_created: {type: [string, "null"]}
      date_modified: {type: [string, "null"]}
      audio_files: {type: [array, "null"]}
      clusters: {type: [array, "null"]}
      panel: {type: [array, "null"]}
      tags: {type: [array, "null"]}
      source: {type: [integer, "null"]}
      blocked: {type: [boolean, "null"]}
      appeal_from: {type: [string, "null"]}
      appeal_from_str: {type: [string, "null"]}
      original_court_info: {type: [object, "null"]}
  audio_meta:
    type: object
    additionalProperties: true
    required:
      [id, resource_uri, absolute_url, docket, case_name,
       download_url, local_path_mp3, local_path_original_file, sha1, source,
       duration, processing_complete, blocked, panel, date_created, date_modified,
       stt_status]
    properties:
      # read by silver
      duration: {type: integer}
      local_path_mp3: {type: string}
      # not read by silver
      id: {type: [integer, "null"]}
      resource_uri: {type: [string, "null"]}
      absolute_url: {type: [string, "null"]}
      docket: {type: [string, "null"]}
      case_name: {type: [string, "null"]}
      case_name_short: {type: [string, "null"]}
      download_url: {type: [string, "null"]}
      local_path_original_file: {type: [string, "null"]}
      sha1: {type: [string, "null"]}
      source: {type: [string, "null"]}
      processing_complete: {type: [boolean, "null"]}
      blocked: {type: [boolean, "null"]}
      panel: {type: [array, "null"]}
      date_created: {type: [string, "null"]}
      date_modified: {type: [string, "null"]}
      filepath_ia: {type: [string, "null"]}
      stt_status: {type: [integer, "null"]}
      stt_source: {type: [integer, "null"]}
      stt_transcript: {type: [string, "null"]}
      ia_upload_failure_count: {type: [integer, "null"]}
