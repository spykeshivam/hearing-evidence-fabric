source_id: oyez_transcripts
owner: shiv
description: Speaker-labelled, timestamped Supreme Court transcripts and case data (evaluation reference)
source_url: https://api.oyez.org/   # undocumented API; save raw JSON immediately
licence:
  id: CC-BY-NC-4.0
  terms_url: https://creativecommons.org/licenses/by-nc/4.0/
  checked_on: 2026-10-16
  attribution: Transcripts and speaker labels from Oyez (oyez.org), CC BY-NC 4.0, normalised and used as the evaluation reference.
  restrictions: [non-commercial only, do not use the Oyez name or logo as endorsement]
classification: public record
refresh: manual, per batch
required_provenance_fields: [source_url, retrieved_at, sha256, licence_id]
# schema: every listed field must be present. Fields silver reads keep a strict type
# (case: name, term, first_party, second_party, advocates, heard_by; transcript:
# transcript.sections[].turns[] with start, stop, speaker.name, speaker.identifier,
# text_blocks[].text); every other field may be null. Unlisted fields pass through
# `additionalProperties: true`. Check docs/decisions.md, 2026-11-13 for more details.
schema:
  case:
    type: object
    additionalProperties: true
    required:
      [ID, docket_number, name, first_party, first_party_label, second_party,
       second_party_label, term, href, justia_url, manner_of_jurisdiction,
       question, facts_of_the_case, description, conclusion, citation,
       lower_court, advocates, heard_by, oral_argument_audio, timeline,
       written_opinion, view_count]
    properties:
      # read by silver
      name: {type: string}
      term: {type: string}
      first_party: {type: string}
      second_party: {type: string}
      advocates: {type: array}
      heard_by: {type: array}
      # not read by silver
      ID: {type: [integer, "null"]}
      docket_number: {type: [string, "null"]}
      first_party_label: {type: [string, "null"]}
      second_party_label: {type: [string, "null"]}
      href: {type: [string, "null"]}
      justia_url: {type: [string, "null"]}
      manner_of_jurisdiction: {type: [string, "null"]}
      question: {type: [string, "null"]}
      facts_of_the_case: {type: [string, "null"]}
      description: {type: [string, "null"]}
      conclusion: {type: [string, "null"]}
      citation: {type: [object, "null"]}
      lower_court: {type: [object, "null"]}
      oral_argument_audio: {type: [array, "null"]}
      timeline: {type: [array, "null"]}
      written_opinion: {type: [array, "null"]}
      view_count: {type: [integer, "null"]}
      decided_by: {type: [object, "null"]}
      decisions: {type: [array, "null"]}
      opinion_announcement: {type: [array, "null"]}
  transcript:
    type: object
    additionalProperties: true
    required: [id, title, unavailable, damaged, media_file, transcript]
    properties:
      # read by silver: transcript.sections[].turns[]
      transcript:
        type: object
        additionalProperties: true
        required: [title, sections]
        properties:
          title: {type: [string, "null"]}
          sections:
            type: array
            items: {$ref: "#/$defs/section"}
      # not read by silver
      id: {type: [integer, "null"]}
      title: {type: [string, "null"]}
      unavailable: {type: [boolean, "null"]}
      damaged: {type: [boolean, "null"]}
      media_file: {type: [array, "null"]}
    $defs:
      section:
        type: object
        additionalProperties: true
        required: [start, stop, byte_start, byte_stop, turns]
        properties:
          # read by silver
          turns:
            type: array
            items: {$ref: "#/$defs/turn"}
          # not read by silver
          start: {type: [number, "null"]}
          stop: {type: [number, "null"]}
          byte_start: {type: [integer, "null"]}
          byte_stop: {type: [integer, "null"]}
      turn:
        type: object
        additionalProperties: true
        required: [start, stop, byte_start, byte_stop, speaker, text_blocks]
        properties:
          # read by silver
          start: {type: number}
          stop: {type: number}
          speaker: {$ref: "#/$defs/speaker"}
          text_blocks:
            type: array
            items: {$ref: "#/$defs/text_block"}
          # not read by silver
          byte_start: {type: [integer, "null"]}
          byte_stop: {type: [integer, "null"]}
      speaker:
        type: object
        additionalProperties: true
        required:
          [ID, href, identifier, last_name, name, length_of_service, view_count]
        properties:
          # read by silver
          identifier: {type: string}
          name: {type: string}
          # not read by silver
          ID: {type: [integer, "null"]}
          href: {type: [string, "null"]}
          last_name: {type: [string, "null"]}
          length_of_service: {type: [integer, "null"]}
          view_count: {type: [integer, "null"]}
          roles: {type: [array, "null"]}
          thumbnail: {type: [object, "null"]}
      text_block:
        type: object
        additionalProperties: true
        required: [start, stop, byte_start, byte_stop, text]
        properties:
          # read by silver
          text: {type: string}
          # not read by silver
          start: {type: [number, "null"]}
          stop: {type: [number, "null"]}
          byte_start: {type: [integer, "null"]}
          byte_stop: {type: [integer, "null"]}
